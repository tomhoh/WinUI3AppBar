name: Build

on:
  push:
    branches: [Experimental, Experimental-2, master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    env:
      Configuration: Release
      Platform: x64
      Solution: AppAppBar3/AppAppBar3.csproj
      # CertSubject must match Package.appxmanifest's Publisher exactly for MSIX signing.
      CertSubject: CN=tomho
      PfxPassword: appbar-ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Generate self-signed code-signing cert
        id: cert
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate `
            -Type CodeSigningCert `
            -Subject "$env:CertSubject" `
            -KeyUsage DigitalSignature `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
          $pwd = ConvertTo-SecureString -String "$env:PfxPassword" -Force -AsPlainText
          $pfxPath = "$env:GITHUB_WORKSPACE\AppAppBar3\ci-cert.pfx"
          $cerPath = "$env:GITHUB_WORKSPACE\AppAppBar3\ci-cert.cer"
          Export-PfxCertificate  -Cert $cert -FilePath $pfxPath -Password $pwd | Out-Null
          Export-Certificate     -Cert $cert -FilePath $cerPath                 | Out-Null
          "thumbprint=$($cert.Thumbprint)"       | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "pfx=AppAppBar3\ci-cert.pfx"           | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "cer=$cerPath"                         | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      # -----------------------------------------------------------------------
      # Option A — MSIX package, signed with the CI-generated self-signed cert.
      # End users must import ci-cert.cer into "Trusted People" before double-
      # clicking the .msix, since the cert isn't rooted in a public CA.
      # -----------------------------------------------------------------------
      - name: Build MSIX (Option A)
        id: msix
        continue-on-error: true
        shell: pwsh
        run: |
          msbuild $env:Solution `
            /restore `
            /p:Configuration=$env:Configuration `
            /p:Platform=$env:Platform `
            /p:AppxPackageSigningEnabled=true `
            /p:PackageCertificateKeyFile="${{ steps.cert.outputs.pfx }}" `
            /p:PackageCertificateThumbprint="${{ steps.cert.outputs.thumbprint }}" `
            /p:PackageCertificatePassword="$env:PfxPassword" `
            /p:GenerateAppxPackageOnBuild=true `
            /p:GenerateAppInstallerFile=false `
            /p:AppxBundle=Never `
            /p:UapAppxPackageBuildMode=SideloadOnly `
            /p:AppxPackageDir="$env:GITHUB_WORKSPACE\publish\msix\\"

      # -----------------------------------------------------------------------
      # Option B — Unpackaged, runtime-dependent. Target machine needs the
      # Windows App Runtime 1.5 installer (https://aka.ms/windowsappsdk).
      #
      # Uses msbuild.exe (from VS) rather than `dotnet publish` because the
      # Windows App SDK 1.5 targets reference Microsoft.Build.Packaging.Pri.Tasks.dll,
      # which ships with Visual Studio — not with the standalone dotnet SDK
      # (MSB4062 otherwise).
      # -----------------------------------------------------------------------
      - name: Build unpackaged runtime-dependent (Option B)
        shell: pwsh
        run: |
          msbuild $env:Solution `
            /restore `
            /t:Publish `
            /p:Configuration=$env:Configuration `
            /p:Platform=$env:Platform `
            /p:RuntimeIdentifier=win-x64 `
            /p:SelfContained=false `
            /p:WindowsPackageType=None `
            /p:PublishDir="$env:GITHUB_WORKSPACE\publish\unpackaged-runtime-dep\\"

      # -----------------------------------------------------------------------
      # Stage the app PRI as resources.pri (workaround — see Option C step).
      # -----------------------------------------------------------------------
      - name: Stage resources.pri (Option B)
        shell: pwsh
        run: |
          $bin  = "$env:GITHUB_WORKSPACE\AppAppBar3\bin\$env:Platform\$env:Configuration\net8.0-windows10.0.19041.0\win-x64"
          $src  = Join-Path $bin "AppAppBar3.pri"
          $dest = "$env:GITHUB_WORKSPACE\publish\unpackaged-runtime-dep\resources.pri"
          if (-not (Test-Path $src)) { throw "App PRI not found at $src" }
          Copy-Item -Path $src -Destination $dest -Force
          Write-Host "Staged $src -> $dest"

      # -----------------------------------------------------------------------
      # Option C — Unpackaged, fully self-contained. ~100 MB, portable.
      # The follow-up "Bundle VC++ runtime" step copies vcruntime/msvcp DLLs in
      # so the artifact runs on machines without VC++ Redist installed.
      # -----------------------------------------------------------------------
      - name: Build unpackaged self-contained (Option C)
        shell: pwsh
        run: |
          msbuild $env:Solution `
            /restore `
            /t:Publish `
            /p:Configuration=$env:Configuration `
            /p:Platform=$env:Platform `
            /p:RuntimeIdentifier=win-x64 `
            /p:SelfContained=true `
            /p:WindowsAppSDKSelfContained=true `
            /p:WindowsPackageType=None `
            /p:PublishDir="$env:GITHUB_WORKSPACE\publish\unpackaged-self-contained\\"

      # -----------------------------------------------------------------------
      # Stage the app PRI as resources.pri. The WinAppSDK 1.8 unpackaged build
      # emits the app's compiled-XAML resource index as "<AssemblyName>.pri"
      # in bin\ but never copies it into the publish folder — that copy is
      # tied to the MSIX packaging path (which is off when WindowsPackageType=
      # None). Without resources.pri next to the .exe, XamlControlsResources
      # in App.xaml fails to merge at runtime and the app crashes inside
      # Microsoft.ui.xaml.dll with 0xc000027b before any managed exception
      # logging can run. Copy + rename is the documented workaround.
      # -----------------------------------------------------------------------
      - name: Stage resources.pri (Option C)
        shell: pwsh
        run: |
          $bin  = "$env:GITHUB_WORKSPACE\AppAppBar3\bin\$env:Platform\$env:Configuration\net8.0-windows10.0.19041.0\win-x64"
          $src  = Join-Path $bin "AppAppBar3.pri"
          $dest = "$env:GITHUB_WORKSPACE\publish\unpackaged-self-contained\resources.pri"
          if (-not (Test-Path $src)) { throw "App PRI not found at $src" }
          Copy-Item -Path $src -Destination $dest -Force
          Write-Host "Staged $src -> $dest"

      # -----------------------------------------------------------------------
      # Bundle the Microsoft Visual C++ runtime DLLs into the self-contained
      # output. WindowsAppSDKSelfContained=true ships the WinAppSDK runtime
      # files but NOT the VC++ runtime — which Microsoft.ui.xaml.dll links to.
      # Without these DLLs, launching on a fresh Windows machine fails with
      # "Unable to load DLL Microsoft.ui.xaml or one of its dependencies"
      # in the Event Viewer. Copying them here makes Option C truly portable.
      # -----------------------------------------------------------------------
      - name: Bundle VC++ runtime in self-contained artifact
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath  = & $vswhere -latest -property installationPath
          $redistVer = (Get-Content "$vsPath\VC\Auxiliary\Build\Microsoft.VCRedistVersion.default.txt").Trim()
          $redistRoot = "$vsPath\VC\Redist\MSVC\$redistVer\$env:Platform"
          $redistDir = Get-ChildItem -Path $redistRoot -Directory -Filter "Microsoft.VC*.CRT" |
                       Select-Object -First 1 -ExpandProperty FullName
          if (-not $redistDir) { throw "VC redist not found under $redistRoot" }
          $dest = "$env:GITHUB_WORKSPACE\publish\unpackaged-self-contained\"
          Copy-Item -Path "$redistDir\*.dll" -Destination $dest -Force
          Write-Host "Bundled VC++ runtime from $redistDir into $dest"
          Get-ChildItem -Path $dest -Filter "*.dll" |
            Where-Object { $_.Name -match '^(msvcp|vcruntime)' } |
            Format-Table Name, Length

      # -----------------------------------------------------------------------
      # Diagnostic: dump key info about the self-contained publish folder so we
      # can debug 0xc000027b-style native init crashes without needing access
      # to a Windows box. Writes a human-readable report to the step summary
      # AND drops _diagnostic.txt inside the artifact for later inspection.
      # -----------------------------------------------------------------------
      - name: Diagnose self-contained artifact
        shell: pwsh
        run: |
          $dir  = "$env:GITHUB_WORKSPACE\publish\unpackaged-self-contained"
          $diag = "$dir\_diagnostic.txt"
          $lines = New-Object System.Collections.Generic.List[string]

          $lines.Add("=== Self-contained publish folder file count ===")
          $all = Get-ChildItem -Path $dir -Recurse -File
          $lines.Add("Total files: $($all.Count)")
          $lines.Add("")

          $lines.Add("=== Top-level files (sorted) ===")
          Get-ChildItem -Path $dir -File | Sort-Object Name |
            ForEach-Object { $lines.Add(("{0,-60} {1,12}" -f $_.Name, $_.Length)) }
          $lines.Add("")

          $lines.Add("=== .manifest files (reg-free WinRT activation) ===")
          $manifests = Get-ChildItem -Path $dir -File -Filter *.manifest
          if ($manifests) {
            $manifests | ForEach-Object { $lines.Add(("{0,-60} {1,12}" -f $_.Name, $_.Length)) }
          } else {
            $lines.Add("NONE FOUND — this is almost certainly the cause of 0xc000027b")
          }
          $lines.Add("")

          $lines.Add("=== resources.pri (XamlControlsResources / MRT) ===")
          if (Test-Path "$dir\resources.pri") {
            $lines.Add("Found: $((Get-Item "$dir\resources.pri").Length) bytes")
          } else {
            $lines.Add("MISSING — XamlControlsResources merge in App.xaml will fail")
          }
          $lines.Add("")

          $lines.Add("=== Embedded manifest in AppAppBar3.exe ===")
          $exe = "$dir\AppAppBar3.exe"
          if (Test-Path $exe) {
            $bytes = [IO.File]::ReadAllBytes($exe)
            $text  = [Text.Encoding]::ASCII.GetString($bytes)
            $hasMuxApp = $text -match 'activatableClass\s+name="Microsoft\.UI\.Xaml\.Application"'
            $hasAppId  = $text -match '<assemblyIdentity[^>]+name="AppAppBar3'
            $hasDpi    = $text -match 'PerMonitorV2'
            $lines.Add("activatableClass Microsoft.UI.Xaml.Application : $hasMuxApp")
            $lines.Add("assemblyIdentity name=`"AppAppBar3...`"            : $hasAppId")
            $lines.Add("PerMonitorV2 dpi awareness                       : $hasDpi")
          } else {
            $lines.Add("AppAppBar3.exe not found — publish step itself failed")
          }
          $lines.Add("")

          $lines.Add("=== Key WinAppSDK / WinUI DLLs present ===")
          $expected = @(
            "Microsoft.ui.xaml.dll",
            "Microsoft.UI.Xaml.Controls.dll",
            "Microsoft.WindowsAppRuntime.dll",
            "Microsoft.WindowsAppRuntime.Bootstrap.dll",
            "Microsoft.WindowsAppRuntime.Insights.Resource.dll",
            "Microsoft.Internal.FrameworkUdk.dll",
            "WebView2Loader.dll",
            "mrm.dll"
          )
          foreach ($name in $expected) {
            $present = Test-Path "$dir\$name"
            $lines.Add(("{0,-50} {1}" -f $name, $(if ($present) { "OK" } else { "MISSING" })))
          }

          $report = $lines -join "`n"
          $report | Out-File -FilePath $diag -Encoding utf8
          $report | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          Write-Host $report

      - name: Upload MSIX artifact
        if: steps.msix.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: AppAppBar3-MSIX-x64
          # Sideload-ready contents only — excludes .appinstaller (invalid auto-update
          # manifest from the stale AppInstallerUri in the csproj) and .appxsym (debug
          # symbols). Includes the .cer so users can import it into Trusted People
          # before installing the .msix.
          path: |
            publish/msix/*_Test/**/*.msix
            publish/msix/*_Test/*.cer
            publish/msix/*_Test/Install.ps1
            publish/msix/*_Test/Add-AppDevPackage.ps1
            publish/msix/*_Test/Add-AppDevPackage.resources/en-US/**
            AppAppBar3/ci-cert.cer
          if-no-files-found: warn

      - name: Upload unpackaged runtime-dependent artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppAppBar3-Unpackaged-RuntimeDep-x64
          path: publish/unpackaged-runtime-dep/
          if-no-files-found: error

      - name: Upload unpackaged self-contained artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppAppBar3-Unpackaged-SelfContained-x64
          path: publish/unpackaged-self-contained/
          if-no-files-found: error

      - name: Summary
        if: always()
        shell: pwsh
        run: |
          $msixState = "${{ steps.msix.outcome }}"
          Add-Content $env:GITHUB_STEP_SUMMARY "## Build artifacts`n"
          Add-Content $env:GITHUB_STEP_SUMMARY "| Variant | Status |"
          Add-Content $env:GITHUB_STEP_SUMMARY "|---|---|"
          Add-Content $env:GITHUB_STEP_SUMMARY "| A — MSIX (signed, sideload) | $msixState |"
          Add-Content $env:GITHUB_STEP_SUMMARY "| B — Unpackaged, runtime-dep | success |"
          Add-Content $env:GITHUB_STEP_SUMMARY "| C — Unpackaged, self-contained | success |"
          Add-Content $env:GITHUB_STEP_SUMMARY "`nMSIX install: import **ci-cert.cer** into *Local Machine > Trusted People* first, then double-click the .msix."
